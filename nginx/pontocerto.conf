# Configuração do Nginx para o PontoCerto — proxy reverso para o processo
# Node.js (gerenciado pelo PM2 na porta 3000, só acessível localmente).
#
# Instalação na VPS (ver DEPLOY_HOSTGATOR_VPS.md para o passo a passo completo):
#   sudo cp nginx/pontocerto.conf /etc/nginx/sites-available/pontocerto
#   sudo ln -s /etc/nginx/sites-available/pontocerto /etc/nginx/sites-enabled/
#   sudo nano /etc/nginx/sites-available/pontocerto   (trocar SEU_DOMINIO_AQUI)
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d seudominio.com.br -d www.seudominio.com.br
#
# O certbot reescreve este arquivo automaticamente para adicionar o bloco
# HTTPS (porta 443) depois de emitir o certificado — não precisa fazer isso
# manualmente.

server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO_AQUI www.SEU_DOMINIO_AQUI;

    # Upload de foto de colaborador pode passar de 1MB — sem isso o Nginx
    # rejeita o upload antes mesmo de chegar no Node.
    client_max_body_size 10M;

    # Logs próprios do site (mais fácil de depurar do que o log geral do Nginx)
    access_log /var/log/nginx/pontocerto-access.log;
    error_log  /var/log/nginx/pontocerto-error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Necessário para o service worker do app mobile (PWA) funcionar
        # corretamente e para futuras conexões long-lived.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Cabeçalhos de segurança básicos
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
