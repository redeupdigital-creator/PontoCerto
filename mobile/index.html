<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1F3A54">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PontoCerto</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1F3A54; --navy-dark:#152A3D; --navy-deep:#0A1730; --navy-black:#080D1A;
    --gold:#B8862E; --gold-light:#E8D9B8; --cyan:#22D3EE; --purple:#8B5CF6; --teal:#2DD4BF;
    --bg:#F4F5F7; --card:#FFFFFF; --line:#E2E5E9; --text:#1F2937; --muted:#6B7480;
    --green:#166534; --green-bg:#E7F3EA; --amber:#8A5A0A; --amber-bg:#FBF0DC; --red:#B91C1C; --red-bg:#FBE9E9;
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--bg); color:var(--text); font-family:'IBM Plex Sans',sans-serif; font-size:15px;
    overscroll-behavior-y:none; user-select:none;
  }
  h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif;}
  .nums{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
  input,textarea,select{user-select:text;}
  button{font-family:inherit; -webkit-tap-highlight-color:transparent;}

  /* ---------- Login ---------- */
  #login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; position:relative; overflow:hidden;
    background:
      radial-gradient(circle, rgba(255,255,255,.05) 1px, transparent 1px) 0 0/20px 20px,
      linear-gradient(160deg, var(--navy-dark) 0%, var(--navy-deep) 60%, var(--navy-black) 100%);
  }
  .login-box{background:#12151F; border:1px solid rgba(255,255,255,.08); border-radius:18px; padding:32px 26px; width:100%; max-width:360px; box-shadow:0 20px 50px rgba(0,0,0,.4); position:relative; z-index:1;}
  .login-box .brand{font-size:20px; color:#fff; text-align:center;}
  .login-box .brand small{display:block; font-family:'IBM Plex Mono'; font-weight:500; font-size:10.5px; color:#93A3BE; letter-spacing:.6px; margin-top:5px;}
  .login-box label{display:block; font-size:12px; color:#93A3BE; margin:16px 0 5px; font-weight:500;}
  .login-box input{width:100%; padding:13px 14px; border:1.5px solid rgba(255,255,255,.12); border-radius:10px; font-size:16px; background:rgba(255,255,255,.04); color:#fff;}
  .login-box input:focus{outline:none; border-color:var(--cyan); box-shadow:0 0 0 3px rgba(34,211,238,.15);}
  .login-box button{
    width:100%; margin-top:22px; border:none; padding:14px; border-radius:10px; font-weight:700; font-size:16px; color:#fff;
    background:linear-gradient(90deg, var(--cyan) 0%, var(--purple) 100%); box-shadow:0 8px 20px rgba(139,92,246,.3);
  }
  .login-err{background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.3); color:#F87171; font-size:13px; padding:10px 12px; border-radius:8px; margin-top:14px;}
  details.api-toggle{margin-top:16px; text-align:center;}
  details.api-toggle summary{font-size:11.5px; color:#93A3BE; cursor:pointer;}
  details.api-toggle input{margin-top:8px; font-size:11.5px; color:#93A3BE;}

  /* ---------- App shell ---------- */
  #app{display:none; min-height:100vh; flex-direction:column;}
  #app.visible{display:flex;}
  header.topbar{
    background:linear-gradient(120deg, var(--navy-dark) 0%, var(--navy-deep) 100%); color:#fff;
    padding:calc(var(--safe-top) + 14px) 18px 14px;
    display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:10;
    box-shadow:0 2px 12px rgba(0,0,0,.15);
  }
  header.topbar .brand{font-size:16px; font-weight:700;}
  header.topbar .who{font-size:10.5px; color:#93A3BE; font-family:'IBM Plex Mono';}
  header.topbar button{background:none; border:none; color:var(--teal); font-size:13px; font-weight:600;}

  main{flex:1; padding:18px 16px calc(90px + var(--safe-bottom));}

  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line);
    display:flex; padding-bottom:var(--safe-bottom); z-index:10; box-shadow:0 -2px 12px rgba(0,0,0,.05);
  }
  nav.tabbar button{
    flex:1; background:none; border:none; padding:10px 0 8px; display:flex; flex-direction:column;
    align-items:center; gap:3px; color:var(--muted); font-size:11px; font-weight:500; position:relative;
  }
  nav.tabbar button .ic{font-size:20px; transition:transform .15s;}
  nav.tabbar button.active{color:var(--navy-dark);}
  nav.tabbar button.active .ic{transform:translateY(-1px);}
  nav.tabbar button.active::before{
    content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:22px; height:3px;
    border-radius:0 0 4px 4px; background:linear-gradient(90deg, var(--cyan), var(--purple));
  }

  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; box-shadow:0 1px 3px rgba(16,24,40,.04);}
  .page-title{margin-bottom:16px;}
  .page-title h1{font-size:19px; margin:0; color:var(--navy-dark);}
  .page-title p{margin:2px 0 0; color:var(--muted); font-size:12.5px;}

  label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:500;}
  input,select,textarea{width:100%; padding:12px 13px; border:1.5px solid var(--line); border-radius:10px; font-size:15px; background:#fff; color:var(--text); margin-bottom:12px; transition:border-color .15s, box-shadow .15s;}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--cyan); box-shadow:0 0 0 3px rgba(34,211,238,.13);}

  button.btn{background:var(--navy); color:#fff; border:none; padding:13px 18px; border-radius:10px; font-size:14.5px; font-weight:700; width:100%; transition:transform .1s, box-shadow .15s;}
  button.btn.gold{background:linear-gradient(90deg, var(--cyan) 0%, var(--purple) 100%); box-shadow:0 6px 16px rgba(139,92,246,.28);}
  button.btn.gold:active{transform:scale(.98);}
  button.btn.ghost{background:#fff; border:1.5px solid var(--line); color:var(--text);}
  button.btn:disabled{opacity:.5;}

  .badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:700;}
  .badge.green{background:var(--green-bg); color:var(--green);}
  .badge.amber{background:var(--amber-bg); color:var(--amber);}
  .badge.red{background:var(--red-bg); color:var(--red);}
  .badge.gray{background:#EDEEF0; color:var(--muted);}

  .msg{padding:10px 13px; border-radius:10px; font-size:13px; margin-bottom:14px;}
  .msg.ok{background:var(--green-bg); color:var(--green);}
  .msg.err{background:var(--red-bg); color:var(--red);}
  .empty{color:var(--muted); font-size:13px; padding:20px 0; text-align:center;}
  .loading{color:var(--muted); font-size:13px; padding:20px 0; text-align:center;}

  /* ---------- Tela de bater ponto ---------- */
  .clock-card{
    background:linear-gradient(160deg, var(--navy) 0%, var(--navy-dark) 100%); color:#fff; border-radius:20px;
    padding:26px 22px; text-align:center; margin-bottom:18px;
  }
  .clock-card .relogio{font-size:44px; font-weight:700; font-family:'IBM Plex Mono',monospace; letter-spacing:1px;}
  .clock-card .data{font-size:13px; color:var(--gold-light); margin-top:2px; text-transform:capitalize;}

  .slots{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
  .slot{background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center;}
  .slot .rotulo{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px;}
  .slot .hora{font-size:18px; font-weight:700; margin-top:4px; font-family:'IBM Plex Mono',monospace;}
  .slot.feito{background:var(--green-bg); border-color:#BFE0C8;}
  .slot.feito .hora{color:var(--green);}
  .slot.pendente .hora{color:var(--line); font-size:16px;}
  .slot.proximo{border-color:var(--cyan); box-shadow:0 0 0 2px rgba(34,211,238,.15);}

  .btn-bater{
    width:100%; padding:22px; border:none; border-radius:18px; color:#fff;
    background:linear-gradient(135deg, var(--cyan) 0%, var(--purple) 100%);
    font-size:18px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:6px;
    box-shadow:0 10px 24px rgba(139,92,246,.35); transition:transform .1s;
  }
  .btn-bater:active{transform:scale(0.98);}
  .btn-bater:disabled{opacity:.6; box-shadow:none;}
  .btn-bater .sub{font-size:12px; font-weight:400; opacity:.9;}
  .btn-bater.concluido{background:var(--green); box-shadow:0 8px 20px rgba(22,101,52,0.3);}

  .geo-status{text-align:center; font-size:11.5px; color:var(--muted); margin-top:10px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; padding:7px 6px; font-size:10.5px; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--line);}
  td{padding:8px 6px; border-bottom:1px solid var(--line);}

  .abono-item{border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px;}
  .abono-item .linha1{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
  .abono-item .data{font-weight:700; font-family:'IBM Plex Mono',monospace;}
  .abono-item .motivo{font-size:12.5px; color:var(--muted);}

  /* ---------- Admin (menu + telas) ---------- */
  .admin-back{display:flex; align-items:center; gap:8px; margin-bottom:14px; cursor:pointer; color:var(--navy); font-weight:600; font-size:13.5px;}
  .admin-menu-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .admin-menu-item{
    background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 12px; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer;
  }
  .admin-menu-item:active{background:#F4F5F7;}
  .admin-menu-item .ic{font-size:24px;}
  .admin-menu-item .lbl{font-size:12px; font-weight:600; color:var(--text);}
  .mini-card{border:1px solid var(--line); border-radius:12px; padding:11px; margin-bottom:8px;}
  .mini-card .linha1{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .resumo-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px;}
  .resumo-item{background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px; text-align:center;}
  .resumo-item .num{font-size:18px; font-weight:700; font-family:'IBM Plex Mono',monospace;}
  .resumo-item .lbl{font-size:10px; color:var(--muted);}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="brand">PontoCerto<small>bater ponto pelo celular</small></div>
    <label>Empresa</label>
    <select id="login-empresa"><option value="">Carregando...</option></select>
    <label>Usuário</label>
    <input id="login-user" autocomplete="username" placeholder="seu.usuario">
    <label>Senha</label>
    <input id="login-pass" type="password" autocomplete="current-password" placeholder="••••••••">
    <button id="btn-login">Entrar</button>
    <div id="login-msg"></div>
    <details class="api-toggle">
      <summary>Endereço da API (avançado)</summary>
      <input id="login-api" value="/api">
    </details>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <div><div class="brand">PontoCerto</div><div class="who" id="who-label"></div></div>
    <button id="btn-logout">Sair</button>
  </header>
  <main id="main"></main>
  <nav class="tabbar">
    <button data-tab="ponto" class="active"><span class="ic">⏱</span>Ponto</button>
    <button data-tab="abono"><span class="ic">📝</span>Abono</button>
    <button data-tab="cartao"><span class="ic">📅</span>Cartão</button>
    <button data-tab="admin" id="tab-admin" style="display:none;"><span class="ic">🛠</span>Admin</button>
    <button data-tab="conta"><span class="ic">👤</span>Conta</button>
  </nav>
</div>

<script>
/* ============================================================
   API
   ============================================================ */
let API_BASE = '/api';
let TOKEN = null;
let PERFIL = null;
let MEU_ID = null;
let EMPRESA_NOME = null;

async function apiFetch(path, options = {}) {
  const headers = options.headers ? { ...options.headers } : {};
  if (TOKEN) headers['Authorization'] = `Bearer ${TOKEN}`;
  if (options.body && !(options.body instanceof FormData)) headers['Content-Type'] = 'application/json';
  const res = await fetch(`${API_BASE}${path}`, { ...options, headers });
  if (res.status === 204) return null;
  let data; try { data = await res.json(); } catch (e) { data = null; }
  if (!res.ok) throw new Error((data && data.erro) || `Erro ${res.status}`);
  return data;
}

/* ============================================================
   LOGIN
   ============================================================ */
document.getElementById('btn-login').addEventListener('click', doLogin);
document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function carregarEmpresasNoLogin(){
  const select = document.getElementById('login-empresa');
  const apiBase = document.getElementById('login-api').value.trim() || '/api';
  try{
    const res = await fetch(`${apiBase}/empresas`);
    const empresas = await res.json();
    select.innerHTML = empresas.length
      ? empresas.map(e=>`<option value="${e.id}">${e.nome}</option>`).join('')
      : `<option value="">Nenhuma empresa cadastrada</option>`;
  }catch(err){
    select.innerHTML = `<option value="">Não foi possível carregar</option>`;
  }
}
carregarEmpresasNoLogin();

async function doLogin(){
  const empresaId = document.getElementById('login-empresa').value;
  const login = document.getElementById('login-user').value.trim();
  const senha = document.getElementById('login-pass').value;
  API_BASE = document.getElementById('login-api').value.trim() || '/api';
  const btn = document.getElementById('btn-login');
  const msgEl = document.getElementById('login-msg');
  msgEl.innerHTML = '';
  if(!empresaId){ msgEl.innerHTML = `<div class="login-err">Selecione a empresa.</div>`; return; }
  btn.disabled = true; btn.textContent = 'Entrando...';
  try{
    const data = await apiFetch('/auth/login', { method:'POST', body: JSON.stringify({ login, senha, empresaId }) });
    TOKEN = data.token; PERFIL = data.perfil; MEU_ID = data.colaboradorId || null;
    EMPRESA_NOME = data.empresaNome || '';
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').classList.add('visible');
    document.getElementById('who-label').textContent = `${login} · ${PERFIL} · ${EMPRESA_NOME}`;
    if (!MEU_ID) {
      msgEl.innerHTML = ''; // segue mesmo assim, mas a tela de ponto vai avisar
    }
    document.getElementById('tab-admin').style.display = PERFIL === 'colaborador' ? 'none' : 'flex';
    render();
  }catch(err){
    msgEl.innerHTML = `<div class="login-err">${err.message.includes('fetch') ? 'Não foi possível conectar à API.' : err.message}</div>`;
  }finally{
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}

document.getElementById('btn-logout').addEventListener('click', ()=>{
  TOKEN = null; PERFIL = null; MEU_ID = null; adminView = null; EMPRESA_NOME = null;
  document.getElementById('app').classList.remove('visible');
  document.getElementById('login-screen').style.display = 'flex';
});

/* ============================================================
   NAV
   ============================================================ */
let currentTab = 'ponto';
let adminView = null; // qual ferramenta admin está aberta (null = menu principal)
document.querySelectorAll('nav.tabbar button[data-tab]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabbar button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    if(currentTab === 'admin') adminView = null;
    render();
  });
});

const main = document.getElementById('main');
function render(){
  main.innerHTML = '';
  if(currentTab === 'admin'){ renderAdmin(); return; }
  ({ ponto: renderPonto, abono: renderAbono, cartao: renderCartao, conta: renderConta })[currentTab]();
}

function showMsg(id, text, type){
  const el = document.getElementById(id);
  if(!el) return;
  el.innerHTML = `<div class="msg ${type}">${text}</div>`;
  setTimeout(()=>{ if(el) el.innerHTML=''; }, 3500);
}

function pad(n){ return String(n).padStart(2,'0'); }
function todayYM(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }

/* ============================================================
   TAB: BATER PONTO
   ============================================================ */
const ORDEM_SLOTS = ['e1','s1','e2','s2'];
const ROTULO_SLOT = { e1:'Entrada', s1:'Saída', e2:'Volta', s2:'Saída' };
const PROXIMA_ACAO = { e1:'Bater Entrada', s1:'Bater Saída (intervalo)', e2:'Bater Volta (intervalo)', s2:'Bater Saída' };

let relogioInterval = null;

function renderPonto(){
  if (!MEU_ID) {
    main.innerHTML = `<div class="card"><div class="empty">Seu usuário não está vinculado a um colaborador — fale com o RH para habilitar o registro de ponto.</div></div>`;
    return;
  }

  main.innerHTML = `
    <div class="clock-card">
      <div class="relogio nums" id="relogio-agora">--:--:--</div>
      <div class="data" id="data-hoje"></div>
    </div>
    <div class="slots" id="slots-hoje"><div class="loading" style="grid-column:span 2;">Carregando...</div></div>
    <button class="btn-bater" id="btn-bater" disabled>Carregando...</button>
    <div class="geo-status" id="geo-status"></div>
    <div id="ponto-msg"></div>
  `;

  atualizarRelogio();
  if (relogioInterval) clearInterval(relogioInterval);
  relogioInterval = setInterval(atualizarRelogio, 1000);

  carregarBatidasHoje();

  document.getElementById('btn-bater').addEventListener('click', baterPonto);
}

function atualizarRelogio(){
  const el = document.getElementById('relogio-agora');
  if (!el) { clearInterval(relogioInterval); return; }
  const agora = new Date();
  el.textContent = agora.toLocaleTimeString('pt-BR');
  document.getElementById('data-hoje').textContent = agora.toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long' });
}

async function carregarBatidasHoje(){
  const ym = todayYM();
  let batidas = [];
  try{
    batidas = await apiFetch(`/batidas?colaboradorId=${MEU_ID}&mes=${ym}`);
  }catch(err){
    showMsg('ponto-msg', err.message, 'err');
  }
  const hojeStr = new Date().toISOString().slice(0,10);
  const registroHoje = batidas.find(b => b.data === hojeStr) || {};
  desenharSlots(registroHoje);
}

function desenharSlots(reg){
  const proximoSlot = ORDEM_SLOTS.find(s => !reg[s]);
  const cont = document.getElementById('slots-hoje');
  cont.innerHTML = ORDEM_SLOTS.map(slot => {
    const feito = !!reg[slot];
    const proximo = slot === proximoSlot;
    return `<div class="slot ${feito?'feito':'pendente'} ${proximo?'proximo':''}">
      <div class="rotulo">${ROTULO_SLOT[slot]}</div>
      <div class="hora nums">${feito ? reg[slot] : '--:--'}</div>
    </div>`;
  }).join('');

  const btn = document.getElementById('btn-bater');
  if (!proximoSlot) {
    btn.disabled = true;
    btn.classList.add('concluido');
    btn.innerHTML = `✓ Ponto completo hoje`;
  } else {
    btn.disabled = false;
    btn.classList.remove('concluido');
    btn.innerHTML = `${PROXIMA_ACAO[proximoSlot]}<span class="sub">toque para registrar agora</span>`;
  }
}

function obterLocalizacao(){
  return new Promise((resolve) => {
    if (!navigator.geolocation) { resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ latitude: pos.coords.latitude, longitude: pos.coords.longitude, precisao: pos.coords.accuracy }),
      () => resolve(null), // permissão negada ou indisponível -> segue sem geo
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
    );
  });
}

async function baterPonto(){
  const btn = document.getElementById('btn-bater');
  const geoStatus = document.getElementById('geo-status');
  btn.disabled = true;
  btn.innerHTML = 'Obtendo localização...';
  geoStatus.textContent = '';

  const geo = await obterLocalizacao();
  geoStatus.textContent = geo ? `📍 Localização capturada (precisão ~${Math.round(geo.precisao)}m)` : '📍 Localização não disponível — batida será registrada sem GPS';

  btn.innerHTML = 'Registrando...';
  try{
    const resultado = await apiFetch('/batidas/bater', { method:'POST', body: JSON.stringify(geo || {}) });
    showMsg('ponto-msg', `${resultado.rotulo} registrada às ${resultado.hora}.`, 'ok');
    if (navigator.vibrate) navigator.vibrate(80);
    await carregarBatidasHoje();
  }catch(err){
    showMsg('ponto-msg', err.message, 'err');
    await carregarBatidasHoje();
  }
}

/* ============================================================
   TAB: ABONO (self-service)
   ============================================================ */
async function renderAbono(){
  main.innerHTML = `
    <div class="page-title"><h1>Abono de Batidas</h1><p>Esqueceu de bater ou trabalhou externamente? Solicite aqui.</p></div>
    <div class="card">
      <label>Data</label><input type="date" id="ab-data">
      <label>Motivo</label>
      <select id="ab-tipo">
        <option value="esquecimento">Esquecimento de batida</option>
        <option value="trabalho_externo">Trabalho externo</option>
        <option value="liberado_gerencia">Liberado pela gerência</option>
        <option value="outro">Outro</option>
      </select>
      <label>Justificativa</label>

async function carregarRelatorioMobile(){
  const cont = document.getElementById('rel-lista');
  if(!cont) return;
  const tipo = document.getElementById('rel-tipo').value;
  const mes = document.getElementById('rel-mes').value;
  cont.innerHTML = `<div class="loading">Carregando...</div>`;
  try{
    const qs = tipo==='falta-atraso' ? `?mes=${mes}` : '';
    const dados = await apiFetch(`/relatorios/${tipo}${qs}`);
    const linhas = tipo==='falta-atraso' ? dados.linhas : dados;
    cont.innerHTML = linhas.length===0 ? `<div class="empty">Nenhum registro.</div>` :
      linhas.map(l=>`<div class="mini-card"><div class="linha1"><strong>${l.colaborador||'—'}</strong><span style="font-size:11px;">${l.data||l.periodo||''}</span></div></div>`).join('');
  }catch(err){ cont.innerHTML = `<div class="msg err">${err.message}</div>`; }

async function baixarRelatorioMobile(formato){
  const tipo = document.getElementById('rel-tipo').value;
  const mes = document.getElementById('rel-mes').value;
  try{
    const res = await fetch(`${API_BASE}/relatorios/${tipo}/exportar?formato=${formato}&mes=${mes}`, { headers:{ Authorization:`Bearer ${TOKEN}` } });
    if(!res.ok) throw new Error('Falha ao gerar arquivo');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${tipo}-${mes}.${formato}`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(err){ alert(err.message); }
}

  try{ lista = await apiFetch('/usuarios'); }catch(err){ cont.innerHTML = `<div class="msg err">${err.message}</div>`; return; }
  cont.innerHTML = lista.map(u=>`<div class="mini-card"><div class="linha1"><strong>${u.login}</strong><span class="badge gray">${u.perfil}</span></div></div>`).join('');
}

/* ---- Auditoria ---- */
async function renderAdminAuditoria(){
  main.innerHTML = botaoVoltar('Auditoria') + `<div id="aud-lista"><div class="loading">Carregando...</div></div>`;
  const cont = document.getElementById('aud-lista');
  let lista;
  try{ lista = await apiFetch('/auditoria?limit=50'); }catch(err){ cont.innerHTML = `<div class="msg err">${err.message}</div>`; return; }
  const rotuloAcao = { create:'Criou', update:'Alterou', delete:'Removeu', aprovar:'Aprovou', reprovar:'Reprovou', reset_senha:'Resetou senha' };
  cont.innerHTML = lista.length===0 ? `<div class="empty">Sem registros.</div>` :
    lista.map(a=>`<div class="mini-card">
      <div class="linha1"><strong>${a.usuarioLogin||'—'}</strong><span style="font-size:11px; color:var(--muted);">${new Date(a.createdAt).toLocaleString('pt-BR')}</span></div>
      <div style="font-size:12px; color:var(--muted);">${rotuloAcao[a.acao]||a.acao} · ${a.entidade}</div>
    </div>`).join('');
}

/* ---- Compliance ---- */
async function renderAdminCompliance(){
  main.innerHTML = botaoVoltar('Compliance') + `
    <div class="card">
      <button class="btn gold" id="btn-afd" style="margin-bottom:10px;">⬇ Exportar AFD</button>
      <button class="btn ghost" id="btn-integridade">Verificar integridade</button>
      <div id="compliance-resultado" style="margin-top:12px;"></div>
    </div>
  `;
  document.getElementById('btn-afd').addEventListener('click', async ()=>{
    try{
      const r = await apiFetch('/afd/exportar?formato=json');
      document.getElementById('compliance-resultado').innerHTML = r.avisos.map(a=>`<div class="msg err" style="background:var(--amber-bg); color:var(--amber);">${a}</div>`).join('');
      const blob = new Blob([r.conteudo], { type:'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = r.nomeArquivo; document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }catch(err){ document.getElementById('compliance-resultado').innerHTML = `<div class="msg err">${err.message}</div>`; }
  });
  document.getElementById('btn-integridade').addEventListener('click', async ()=>{
    const cont = document.getElementById('compliance-resultado');
    cont.innerHTML = `<div class="loading">Verificando...</div>`;
    try{
      const r = await apiFetch('/afd/integridade');
      cont.innerHTML = r.integro ? `<div class="msg ok">✅ Cadeia íntegra (${r.totalRegistros} registros).</div>` : `<div class="msg err">⚠️ Quebrou no NSR ${r.quebrouNoNsr}.</div>`;
    }catch(err){ cont.innerHTML = `<div class="msg err">${err.message}</div>`; }
  });
}

   ============================================================ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
